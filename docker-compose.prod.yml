# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

services:
  app:
    restart: always
    environment:
      ENVIRONMENT: production
      WATCHFILES_FORCE_POLLING: ""
    volumes:
      - app_media:/app/media
    command:
      - /opt/venv/bin/uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --loop
      - uvloop
      - --http
      - httptools
