<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Backbone Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 font-sans leading-normal tracking-normal">
    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- Sidebar -->
        <div class="bg-indigo-900 shadow-xl h-full md:h-screen w-full md:w-64 fixed md:relative z-20 transition-all duration-300">
            <div class="px-6 py-8 border-b border-indigo-800/50">
                <a href="/admin" class="flex items-center space-x-3 text-white">
                    <div class="bg-indigo-500 p-2 rounded-lg">
                        <i class="fas fa-layer-group text-lg"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight">Backbone <span class="text-indigo-300 font-light">Admin</span></span>
                </a>
            </div>
            
            <div class="mt-8 px-4 overflow-y-auto custom-scrollbar h-[calc(100vh-120px)]">
                <p class="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-4 px-2">Models</p>
                <nav class="space-y-1">
                    {% for model in models %}
                    <a href="/admin/{{ model.name }}" class="flex items-center px-4 py-3 text-indigo-100 hover:bg-indigo-800 rounded-xl transition-colors group">
                        <i class="far fa-folder text-indigo-400 group-hover:text-white mr-3 transition-colors"></i>
                        <span class="font-medium">{{ model.name }}</span>
                    </a>
                    {% endfor %}
                </nav>

                <div class="mt-12 px-2 border-t border-indigo-800/50 pt-8 pb-4">
                    <a href="/admin/logout" class="flex items-center text-indigo-300 hover:text-white transition-colors">
                        <i class="fas fa-sign-out-alt mr-2"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0 bg-slate-50">
            <!-- Topbar -->
            <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8 sticky top-0 z-10">
                <div class="flex items-center">
                    <h1 class="text-lg font-semibold text-slate-800">{% block header %}{% endblock %}</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-slate-500 h-8 flex items-center px-3 bg-slate-100 rounded-full">
                        <i class="far fa-user-circle mr-2 text-indigo-500"></i>
                         {{ user.username if user else 'Admin' }}
                    </span>
                </div>
            </header>

            <!-- Page Content -->
            <main class="p-8 flex-1">
                {% block content %}{% endblock %}
            </main>
            
            <footer class="bg-white border-t border-slate-200 py-4 px-8 text-center text-xs text-slate-400">
                &copy; {{ now.year }} Backbone Framework - Advanced Admin Interface
            </footer>
        </div>
    </div>
</body>
</html>
